<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>PersonalAI</title><style>body{margin:0;padding:24px;background:#111318;color:white;font-family:sans-serif}input{padding:12px;border-radius:10px}button{padding:12px;background:#6688ff;color:white;border:0;border-radius:10px}</style></head><body><h1>PersonalAI</h1><p>你好，欢迎回来。</p><input id="msg" placeholder="发送消息"><button id="send">发送</button><div id="out"></div><script>document.getElementById("send").addEventListener("click",function(){const v=document.getElementById("msg").value.trim();if(!v)return;const p=document.createElement("p");p.textContent="你："+v;document.getElementById("out").appendChild(p);document.getElementById("msg").value=""})</script></body></html>
