
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>PersonalAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#111318;color:white;font-family:sans-serif}
input{padding:12px;border-radius:10px;background:#20242c;color:white;border:1px solid #444}
button{padding:12px;background:#6688ff;color:white;border:0;border-radius:10px}
p{overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>PersonalAI</h1>
<p>你好，欢迎回来。</p>
<div id="out"></div>
<input id="msg" placeholder="发送消息">
<button id="send" type="button">发送</button>
<button id="clear" type="button">清空记录</button>
<script>
const key="personalai_messages_v1";
let messages=[];
const out=document.getElementById("out");
const input=document.getElementById("msg");

function render(){
out.innerHTML="";
messages.forEach(v=>{
let p=document.createElement("p");
p.textContent="你："+v;
out.appendChild(p);
});
}

function send(){
let v=input.value.trim();
if(!v)return;
messages.push(v);
try{
localStorage.setItem(key,JSON.stringify(messages));
}catch(e){
alert("保存失败："+e.message);
}
input.value="";
render();
}

try{
messages=JSON.parse(localStorage.getItem(key)||"[]");
if(!Array.isArray(messages))messages=[];
}catch(e){messages=[];}

document.getElementById("send").onclick=send;
input.onkeydown=function(e){
if(e.key==="Enter")send();
};

document.getElementById("clear").onclick=function(){
if(confirm("确定清空记录？")){
messages=[];
localStorage.removeItem(key);
render();
}
};

render();
</script>
</body>
</html>
